<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} — CertValid</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <div class="logo-icon">🛡️</div>
    CertValid
  </div>
  <div class="navbar-links">
    <a href="{{ url_for('index') }}">← Back to Home</a>
  </div>
</nav>

<div class="page-wrapper">
  <div class="container">
    <div style="min-height:60vh; display:flex; align-items:center; justify-content:center;">
      <div class="card fade-in-up" style="text-align:center; max-width:480px; padding:3rem 2.5rem;">

        <div style="font-size:4rem; margin-bottom:1rem;">
          {% if code == 404 %}🔍{% else %}⚠️{% endif %}
        </div>

        <div style="font-size:4rem; font-weight:800; margin-bottom:.5rem;
          background: linear-gradient(135deg, var(--indigo-light), var(--red-light));
          -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
          {{ code }}
        </div>

        <h1 style="font-size:1.4rem; margin-bottom:.75rem;">{{ title }}</h1>
        <p style="color:var(--text-muted); font-size:.95rem; margin-bottom:2rem;">{{ message }}</p>

        <div style="display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap;">
          <a href="{{ url_for('index') }}" class="btn btn-primary">🏠 Go Home</a>
          <button onclick="history.back()" class="btn btn-ghost">← Go Back</button>
        </div>

      </div>
    </div>
  </div>
</div>

</body>
</html>
