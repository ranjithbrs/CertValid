name: CI Test Suite & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests & Security Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security & Concurrency Test Suite
        env:
          ADMIN_USERNAME: testadmin
          ADMIN_PASSWORD: TestPassword123!
        run: |
          python -m unittest tests/test_security_audit.py -v

      - name: Generate Security Audit Evidence Artifacts
        run: |
          python tests/generate_test_evidence.py

      - name: Upload Test Evidence Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: security-audit-evidence
          path: tests/evidence/
          retention-days: 14
